name: Quality Gate (reusable)

# Fast checks only — runs on every push to develop and every PR to main.
# No deploy, no staging, no docker push.
# Target: under 5 minutes.
#
# Per-area gating: detect-changes job decides which areas (backend / frontend /
# infra) actually changed; downstream jobs skip if their area didn't change.
# This keeps frontend-only commits from running the full Python test suite.

on:
  workflow_call:
    outputs:
      backend:
        description: "True if backend code, tests, or scripts changed"
        value: ${{ jobs.detect-changes.outputs.backend }}
      backend_runtime:
        description: "True if deployable backend runtime changed"
        value: ${{ jobs.detect-changes.outputs.backend_runtime }}
      frontend:
        description: "True if frontend code changed"
        value: ${{ jobs.detect-changes.outputs.frontend }}
      infra:
        description: "True if Terraform code changed"
        value: ${{ jobs.detect-changes.outputs.infra }}
      staging:
        description: "True if staging workflow, smoke, E2E, or CI scripts changed"
        value: ${{ jobs.detect-changes.outputs.staging }}

permissions:
  contents: read
  security-events: write
  pull-requests: read  # gitleaks needs to list PR commits, checkov lists PR files

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_runtime: ${{ steps.filter.outputs.backend_runtime }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      staging: ${{ steps.filter.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  sops-guard:
    name: SOPS age guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-sops-secrets.sh

  typecheck:
    name: Typecheck (Pyright)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.6"
      # uv reads uv.lock; pip does not. CI used to test a different resolution
      # than the image ships (issue #278). --locked fails when the lockfile no
      # longer matches pyproject.toml — --frozen would not.
      - run: uv sync --locked --extra dev --extra api --extra cloud --extra report --extra ksef --extra pdf
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # pyright is CI tooling, in neither pyproject nor uv.lock. Isolated and
      # pinned so local and CI cannot disagree about what "clean" means.
      - run: uvx pyright@1.1.409
      - run: uv run pytest tests/ -q --tb=short --cov=zdrovena --cov-fail-under=80

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.6"
      # Both dev selectors: pip-audit and bandit live in [dependency-groups] dev,
      # the rest of the tooling in [project.optional-dependencies] dev.
      # The old `pip install --upgrade pip` (CVE-2026-3219, CVE-2026-6357) is
      # gone with pip itself — nothing in this job installs with pip any more.
      - run: uv sync --locked --group dev --extra dev --extra api --extra cloud
      # uv sync installs into .venv; the pip-audit and bandit steps below call
      # the binaries by name, so the environment has to be on PATH.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: |
          pip-audit \
            --ignore-vuln PYSEC-2026-89 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2026-237 \
            --ignore-vuln CVE-2026-34993 \
            --ignore-vuln CVE-2026-47265 \
            --ignore-vuln CVE-2026-54273 \
            --ignore-vuln CVE-2026-54279 \
            --ignore-vuln CVE-2026-54277 \
            --ignore-vuln CVE-2026-50269 \
            --ignore-vuln CVE-2026-54276 \
            --ignore-vuln CVE-2026-54278 \
            --ignore-vuln CVE-2026-54280 \
            --ignore-vuln CVE-2026-54274 \
            --ignore-vuln PYSEC-2022-260 \
            --ignore-vuln CVE-2026-40087 \
            --ignore-vuln CVE-2026-44843 \
            --ignore-vuln CVE-2026-48775 \
            --ignore-vuln CVE-2026-48776 \
            --ignore-vuln CVE-2026-41182 \
            --ignore-vuln CVE-2026-45134 \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8
      - run: bandit -r zdrovena/ -ll -ii
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  api-contracts:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.6"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra api --extra cloud --extra report --extra ksef --extra pdf
      # scripts/generate-api-contracts.sh calls python3 directly, so the uv
      # environment has to be on PATH rather than reached through uv run.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - working-directory: frontend
        run: npm ci
      - run: scripts/check-api-contracts.sh
      - working-directory: frontend
        run: npm run check:api-types

  infra:
    name: Terraform validate + Checkov
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -lock-timeout=5m
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12
        with:
          directory: infra/terraform
          quiet: true
          soft_fail: false

  frontend-check:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run lint && npm test && npm run build

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs:
      - detect-changes
      - sops-guard
      - typecheck
      - security
      - api-contracts
      - infra
      - frontend-check
    steps:
      - name: Require every applicable quality job to pass
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Quality job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "::error::One or more quality jobs failed or were cancelled."
            exit 1
          fi
          echo "All applicable quality jobs passed; skipped areas are allowed."
