name: Release validation (on demand)

# A full isolated staging run for an explicitly selected ref. There is no
# schedule: release PRs invoke the same reusable suite automatically, while an
# operator can run this workflow when an additional validation is useful.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: release-validation-on-demand
  cancel-in-progress: false

jobs:
  acceptance:
    name: Full on-demand staging validation
    uses: ./.github/workflows/_full-test-suite.yml
    with:
      backend_changed: "true"
      frontend_changed: "true"
      preview_environment: on-demand-${{ github.run_id }}
    secrets: inherit
