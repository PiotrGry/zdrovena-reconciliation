name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Git SHA obrazu do którego wracamy (np. abc1234). Zostaw puste = poprzednia rewizja."
        required: false
        type: string
      reason:
        description: "Powód rollbacku (widoczny w audit logu)"
        required: true
        type: string

# OIDC — brak długożyjących credentials
permissions:
  id-token: write
  contents: read

# Nigdy nie anuluj rollbacku — niech się skończy.
# Osobna grupa od production-deploy — rollback musi móc wystartować natychmiast
# nawet gdy deploy jest w toku (emergency rollback nie może czekać w kolejce).
concurrency:
  group: production-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production  # wymagane zatwierdzenie jeśli skonfigurowano

    steps:
      - name: Log rollback intent
        run: |
          echo "======================================"
          echo "ROLLBACK INITIATED"
          echo "Triggered by: ${{ github.actor }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Target SHA: ${{ inputs.image_sha || '(poprzednia rewizja)' }}"
          echo "======================================"

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Rollback do konkretnego obrazu (SHA podany ręcznie) ──────────────
      - name: Rollback to specific image
        if: inputs.image_sha != ''
        env:
          IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/zdrovena-api
        run: |
          TARGET_IMAGE="$IMAGE:${{ inputs.image_sha }}"
          echo "Deploying image: $TARGET_IMAGE"
          az containerapp update \
            --name           "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image          "$TARGET_IMAGE"
          echo "Done. Container App now running: $TARGET_IMAGE"

      # ── Rollback do poprzedniej rewizji (bez podanego SHA) ────────────────
      - name: Rollback to previous revision
        if: inputs.image_sha == ''
        run: |
          set -euo pipefail
          # Single-revision mode: list with --all (otherwise only the active
          # revision is returned) and redeploy the previous revision's image.
          PREV_IMAGE=$(az containerapp revision list --all \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "sort_by(@, &properties.createdTime) | [-2].properties.template.containers[0].image" \
            --output tsv)

          if [[ -z "$PREV_IMAGE" ]]; then
            echo "Brak poprzedniej rewizji — manual intervention required."
            exit 1
          fi

          echo "Deploying previous image: $PREV_IMAGE"
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$PREV_IMAGE" --output none

          echo "Rollback complete. Container App now running: $PREV_IMAGE"
