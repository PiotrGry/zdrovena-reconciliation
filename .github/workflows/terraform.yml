name: Terraform infra

# Runs Terraform plan/apply for infra/terraform/.
#   - PR touching infra/**     → plan + comment on PR (read-only, no apply)
#   - Push to main             → plan, manual approval, apply of THAT plan
#   - Manual workflow_dispatch → plan only
#
# Replaces the previous flow where Terraform was run from the maintainer's laptop
# (required ip_rules allowlist for the operator's home IP).

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/actions/azure-terraform-credentials/**'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
      - '.github/actions/azure-terraform-credentials/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  # Static inputs, declared once. The environment-scoped ops_alert_email stays
  # at job level, where the binding to `staging` / `production-infra` is explicit.
  TF_VAR_terraform_ip_allowlist: '[]'
  TF_VAR_swa_custom_domain: portal.wodahumio.pl

defaults:
  run:
    working-directory: infra/terraform

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot-triggered workflows cannot access Azure secrets. They still run
    # fmt and validate with an offline init; authenticated login and plan steps
    # are skipped individually below.
    # OIDC subject claim must match an existing federated credential on the
    # gha SP. The `staging` env's federated cred (subject :environment:staging)
    # exists; the default `:pull_request` subject does not. Reuse staging.
    environment: staging
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_ops_alert_email: ${{ vars.OPS_ALERT_EMAIL }}
    outputs:
      plan-exit-code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        if: github.actor != 'dependabot[bot]'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sanitize ARM credentials
        if: github.actor != 'dependabot[bot]'
        uses: ./.github/actions/azure-terraform-credentials
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          api-client-id: ${{ secrets.AZURE_API_CLIENT_ID }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (offline for Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: terraform init -backend=false -input=false

      - name: Terraform init
        if: github.actor != 'dependabot[bot]'
        # ARM_* env vars are set by the credentials action via $GITHUB_ENV.
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Skip authenticated plan for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot pull requests do not receive Azure secrets, so this workflow runs offline terraform validation only."

      # Fail with a sentence that says what to set, instead of leaving Terraform
      # to report a confusing downstream error about an empty variable.
      - name: Require plan inputs
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ -z "$TF_VAR_ops_alert_email" ]; then
            echo "::error::OPS_ALERT_EMAIL is empty. Set it as a variable on the 'staging' GitHub environment (Settings → Environments → staging → Variables)." >&2
            exit 1
          fi

      - name: Terraform plan
        id: plan
        if: github.actor != 'dependabot[bot]'
        # exit 2 = changes pending (not a failure here — CI gate decides)
        # exit 1 = real error
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          exitcode=${PIPESTATUS[0]}
          echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
          [ $exitcode -eq 1 ] && exit 1 || exit 0

      # The binary plan is deliberately NOT uploaded. It can contain variable
      # values and other sensitive data, and this job never applies it, so the
      # artifact was pure exposure with no consumer (issue #138).
      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const planRaw = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            const max = 60000;
            const plan = planRaw.length > max
              ? planRaw.slice(0, max) + `\n\n…(truncated, ${planRaw.length - max} bytes omitted — see workflow logs)`
              : planRaw;
            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const summary = exitcode === '0'
              ? 'No infrastructure changes.'
              : exitcode === '2'
                ? 'Changes pending — review the plan below.'
                : 'Plan failed — see workflow logs.';
            const body = `### Terraform Plan\n\n${summary}\n\n<details><summary>Plan output</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('### Terraform Plan'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Binds this job to the production-infra environment, so its variables and
    # secrets resolve and the OIDC subject claim is
    # `…:environment:production-infra`. The header comment used to claim this
    # gating existed while no `environment:` was declared at all (issue #138).
    environment: production-infra
    # Approval gate: GitHub Free + private repo blocks Required reviewers, so we
    # use trstringer/manual-approval which creates an issue and pauses until the
    # listed approver comments "approve" / "approved" / "lgtm". Free, audit-trailed.
    permissions:
      issues: write
      contents: read
      id-token: write
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_ops_alert_email: ${{ vars.OPS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sanitize ARM credentials
        uses: ./.github/actions/azure-terraform-credentials
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          api-client-id: ${{ secrets.AZURE_API_CLIENT_ID }}

      - name: Require apply inputs
        # azure_client_id_entra defaults to "" (see variables.tf) to allow an
        # empty value during initial local setup — but that same default
        # silently disables JWT audience validation in prod (auth.py). Fail
        # the production apply rather than let this ship as a silent bypass.
        run: |
          missing=0
          if [ -z "$TF_VAR_azure_client_id_entra" ]; then
            echo "::error::AZURE_API_CLIENT_ID secret is empty — applying would disable JWT audience validation in production. Set the secret before re-running." >&2
            missing=1
          fi
          if [ -z "$TF_VAR_ops_alert_email" ]; then
            echo "::error::OPS_ALERT_EMAIL is empty — alert rules would have no recipient, which is an alert that fires into the void. Set it as a variable on the 'production-infra' GitHub environment." >&2
            missing=1
          fi
          exit "$missing"

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      # The plan is produced BEFORE approval, so the approver decides on a
      # concrete diff for this exact commit. Previously approval came first and
      # covered "run apply", with no production plan in existence — the approval
      # issue even told the approver to review a plan that was never generated.
      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          {
            echo "## Terraform plan for \`${{ github.sha }}\`"
            echo
            echo '```hcl'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          summary=$(grep -E '^Plan: |^No changes\.' plan.txt | tail -1)
          echo "summary=${summary:-plan produced, see the run summary}" >> "$GITHUB_OUTPUT"

      - name: Wait for manual approval
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.TOKEN }}
          approvers: PiotrGry
          minimum-approvals: 1
          issue-title: "Terraform apply — run #${{ github.run_number }} (${{ github.sha }})"
          issue-body: |
            Manual approval required before applying terraform changes to production.

            **Commit:** ${{ github.sha }}
            **Triggered by:** ${{ github.event.head_commit.author.name }}
            **Plan:** `${{ steps.plan.outputs.summary }}`
            **Run summary (full plan):** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The plan above was generated for this exact commit and is saved. Approving
            applies that saved plan — not a plan recomputed later.

            Review it, then comment one of: `approve`, `approved`, `lgtm` (or `deny` / `denied` to cancel).

      # Applies the saved plan, so what runs is exactly what was approved rather
      # than whatever Terraform would compute now.
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color tfplan
