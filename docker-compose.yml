# Local development environment
# Starts: Azurite (Azure Storage emulator) + FastAPI backend
# Frontend runs natively: cd frontend && npm run dev
#
# Usage:
#   docker compose up          # start all services
#   docker compose up -d       # start in background
#   docker compose down        # stop and remove containers
#
# After first start, seed the storage with test invoice files:
#   python3 scripts/seed-local-storage.py

services:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: zdrovena-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
      - ./scripts/azurite-healthcheck.js:/healthcheck.js:ro
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zdrovena-api
    ports:
      - "8000:8000"
    volumes:
      - ./zdrovena:/app/zdrovena
      - ./scripts:/app/scripts
      - faktury_data:/app/data/faktury
      # SOPS+age secrets tier. The repo root is mounted as a DIRECTORY, not
      # the single .env.local.sops file: write_local_fallback() finishes with
      # os.replace(), and renaming over a single-file bind mount fails with
      # EBUSY — the container could then read rotated secrets but never
      # persist one. Trade-off: the container gets write access to the whole
      # repo, which it already has for ./zdrovena and ./scripts.
      - ./:/secrets
      # Private age key, read-only. Never COPY it into the image — it would
      # end up in a layer and in every registry push.
      - ${HOME}/.config/sops/age/keys.txt:/run/secrets/age-keys.txt:ro
      # sops resolves .sops.yaml relative to the process CWD (/app here), not
      # relative to the file it is encrypting. Without this mount every
      # ENCRYPT fails with "config file not found, or has no creation rules"
      # — decrypt still works, so the failure only shows up when a rotated
      # secret is being persisted. Read-only: nothing writes it.
      - ./.sops.yaml:/app/.sops.yaml:ro
    env_file:
      - path: .env.local
        required: false
    environment:
      AZURE_AUTH_DISABLED: "true"
      PROVIDER_MODE: "${PROVIDER_MODE:-fake}"
      SHOPIFY_WEBHOOK_SECRET: "${SHOPIFY_WEBHOOK_SECRET:-e2e-webhook-secret}"
      # Allegro + InPost run against the vendors' real SANDBOX environments.
      # Credentials come from .env.local via env_file above — deliberately NOT
      # repeated here, because an `environment:` entry overrides env_file and
      # `${VAR:-fake}` interpolates from the host shell (not from .env.local),
      # which would silently feed "fake" to a real sandbox endpoint.
      #
      # ALLEGRO_BASE_URL / ALLEGRO_AUTH_URL exist only to redirect the client at
      # fake-providers. With them unset, ALLEGRO_ENV picks the vendor's own URLs
      # (zdrovena/common/allegro.py) — sandbox is api.allegro.pl.allegrosandbox.pl.
      ALLEGRO_ENV: "sandbox"
      # The Allegro refresh/access tokens are deliberately absent from
      # .env.local — they rotate on every use, and an env var here would be
      # checked before the SOPS tier and pin the process to a token Allegro
      # has already invalidated. They live only in .env.local.sops, which
      # these two variables point the secrets tier at.
      ZDROVENA_SOPS_FILE: "/secrets/.env.local.sops"
      SOPS_AGE_KEY_FILE: "/run/secrets/age-keys.txt"
      # INPOST_BASE_URL is supplied by .env.local (sandbox-api-shipx-pl.easypack24.net).
      APACZKA_APP_ID: "${APACZKA_APP_ID:-fake}"
      APACZKA_APP_SECRET: "${APACZKA_APP_SECRET:-fake}"
      APACZKA_BASE_URL: "http://fake-providers:9009/apaczka/api/v2"
      FAKTUROWNIA_BASE_URL: "http://fake-providers:9009/fakturownia"
      FAKTUROWNIA_BASE_DIR: "/app/data/faktury"
      FAKTUROWNIA_API_TOKEN: "${FAKTUROWNIA_API_TOKEN:-dev-placeholder}"
      KSEF_ENABLED: "false"
      MOCK_COURIER: "${MOCK_COURIER:-0}"
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_STORAGE_CONTAINER: "zdrovena-files"
    depends_on:
      azurite:
        condition: service_healthy
      fake-providers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  fake-providers:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zdrovena-fake-providers
    command: ["uvicorn", "zdrovena.fake_providers.app:app", "--reload", "--host", "0.0.0.0", "--port", "9009"]
    ports:
      - "9009:9009"
    volumes:
      - ./zdrovena:/app/zdrovena
    environment:
      APP_ENV: "development"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9009/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  azurite_data:
  faktury_data:
